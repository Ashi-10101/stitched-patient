id: adult-tension-pneumothorax
title: Adult Tension Pneumothorax

patient:
  age: 32
  sex: male
  summary: "Sudden onset chest pain and shortness of breath following motor vehicle collision"

engine:
  startingState: /pulse/bin/states/StandardMale@0s.json

timeline:
  scheduledInsults:
    - timeSeconds: 30
      action: SETensionPneumothorax
      parameters:
        side: Left
        type: Closed
        severity: 0.75

alarms:
  heartRate:
    critical:
      low: 40
      high: 140
    warning:
      low: 50
      high: 120
    normal:
      low: 60
      high: 100
  
  respiratoryRate:
    critical:
      low: 8
      high: 35
    warning:
      low: 10
      high: 24
    normal:
      low: 12
      high: 20
  
  spO2:
    critical:
      low: 0.88
    warning:
      low: 0.92
    normal:
      low: 0.95
      high: 1.0
  
  meanArterialPressure:
    critical:
      low: 60
      high: 120
    warning:
      low: 70
      high: 110
    normal:
      low: 70
      high: 100
  
  etCO2:
    # TODO(author): verify EtCO2 alarm thresholds and add clinical source
    critical:
      low: 25
      high: 50
    warning:
      low: 30
      high: 45
    normal:
      low: 35
      high: 45
  
  tidalVolume:
    # TODO(author): verify tidal volume alarm thresholds and add clinical source
    critical:
      low: 300
      high: 800
    warning:
      low: 400
      high: 700
    normal:
      low: 450
      high: 600

interventions:
  - id: needle-decompression-left
    label: "Needle decompression - left"
    # TODO(author): Play label wording for the left needle decompression - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
    playLabel: "Let the trapped air out - left side (needle)"
    action: SENeedleDecompression
    parameters:
      side: Left
      state: "On"
  
  - id: needle-decompression-right
    label: "Needle decompression - right"
    # TODO(author): Play label wording for the right needle decompression - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
    playLabel: "Let the trapped air out - right side (needle)"
    action: SENeedleDecompression
    parameters:
      side: Right
      state: "On"

play:
  # TODO(author): goal text wording - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
  goalText: "Keep him breathing until he's out of danger."
  # TODO(author): diagnosis terms list - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
  diagnosisTerms: ["pneumothorax", "tension"]
  avatar:
    # TODO(author): reference tidal volume for the breathing-depth display (engine baseline), verify and cite - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
    referenceTidalVolumeMl: 535
  endings:
    rescued:
      conditions:
        # TODO(author): rescue SpO2 threshold - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        - { vital: "spO2", op: ">=", value: 0.95 }
        # TODO(author): rescue heart rate threshold - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        - { vital: "heartRate", op: "<=", value: 110 }
      # TODO(author): rescue hold duration - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
      holdSeconds: 30
      # Author's decision of 2026-11-20: rescue counts only after the left needle decompression (Requirements 2.21-2.23, 6.18)
      requiredInterventions: ["needle-decompression-left"]
    lost:
      groups:
        - conditions:
            # TODO(author): lost SpO2 threshold - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
            - { vital: "spO2", op: "<", value: 0.85 }
          # TODO(author): lost hold duration - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
          holdSeconds: 30
      # TODO(author): time limit - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
      timeLimitSeconds: 600
  hints:
    # TODO(author): hint 1 text - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
    - text: "Watch his chest. Does one side move differently from the other?"
    # TODO(author): hint 2 text - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
    - text: "The trouble is on his left side. On your screen, that's the right."
    # TODO(author): hint 3 text - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
    - text: 'Press "Let the trapped air out - left side (needle)".'
  status:
    rules:
      - when: [{ vital: "spO2", band: "critical" }]
        # TODO(author): status sentence for critical SpO2 - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "His lips are turning blue and he is fighting for breath."
      - when: [{ vital: "spO2", band: "warning" }]
        # TODO(author): status sentence for warning SpO2 - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "He looks pale and is struggling to breathe."
      - when: [{ vital: "heartRate", band: "critical", direction: "high" }]
        # TODO(author): status sentence for critical high heart rate - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "His heart is racing and he looks frightened."
      - when: [{ vital: "heartRate", band: "warning", direction: "high" }]
        # TODO(author): status sentence for warning high heart rate - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "His heart is beating fast and he looks uneasy."
      - when: [{ vital: "respiratoryRate", band: "warning", direction: "high" }]
        # TODO(author): status sentence for warning high respiratory rate - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "He is breathing faster than normal."
      - when: [{ vital: "meanArterialPressure", band: "warning", direction: "low" }]
        # TODO(author): status sentence for warning low mean arterial pressure - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "He looks clammy and a little faint."
    # TODO(author): default status sentence - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
    defaultSentence: "He is breathing calmly and looks comfortable."

references:
  # TODO(author): Add specific ATLS or other trauma guideline references for tension pneumothorax recognition and management
  - citation: "American College of Surgeons. Advanced Trauma Life Support (ATLS) Student Course Manual. 10th ed."
    url: "https://www.facs.org/quality-programs/trauma/atls/"
