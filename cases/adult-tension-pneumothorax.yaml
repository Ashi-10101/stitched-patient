id: adult-tension-pneumothorax
title: Adult Tension Pneumothorax

patient:
  age: 32
  sex: male
  summary: "Sudden onset chest pain and shortness of breath following motor vehicle collision"

engine:
  startingState: /pulse/bin/states/StandardMale@0s.json

timeline:
  scheduledInsults:
    - timeSeconds: 30
      action: SETensionPneumothorax
      parameters:
        side: Left
        type: Closed
        severity: 0.75

alarms:
  heartRate:
    critical:
      low: 40
      high: 140
    warning:
      low: 50
      high: 120
    normal:
      low: 60
      high: 100
  
  respiratoryRate:
    critical:
      low: 8
      high: 35
    warning:
      low: 10
      high: 24
    normal:
      low: 12
      high: 20
  
  spO2:
    critical:
      low: 0.88
    warning:
      low: 0.92
    normal:
      low: 0.95
      high: 1.0
  
  meanArterialPressure:
    critical:
      low: 60
      high: 120
    warning:
      low: 70
      high: 110
    normal:
      low: 70
      high: 100
  
  etCO2:
    # TODO(author): verify EtCO2 alarm thresholds and add clinical source
    critical:
      low: 25
      high: 50
    warning:
      low: 30
      high: 45
    normal:
      low: 35
      high: 45
  
  tidalVolume:
    # TODO(author): verify tidal volume alarm thresholds and add clinical source
    critical:
      low: 300
      high: 800
    warning:
      low: 400
      high: 700
    normal:
      low: 450
      high: 600

interventions:
  - id: needle-decompression-left
    label: "Needle decompression - left"
    # TODO(author): Play label wording for the left needle decompression - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
    playLabel: "Let the trapped air out - left side (needle)"
    action: SENeedleDecompression
    parameters:
      side: Left
      state: "On"
  
  - id: needle-decompression-right
    label: "Needle decompression - right"
    # TODO(author): Play label wording for the right needle decompression - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
    playLabel: "Let the trapped air out - right side (needle)"
    action: SENeedleDecompression
    parameters:
      side: Right
      state: "On"

play:
  # TODO(author): goal text wording - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
  goalText: "Keep him breathing until he's out of danger."
  # TODO(author): diagnosis terms list - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
  diagnosisTerms: ["pneumothorax", "tension"]
  avatar:
    # TODO(author): reference tidal volume for the breathing-depth display (engine baseline), verify and cite - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
    referenceTidalVolumeMl: 535
  endings:
    rescued:
      conditions:
        # TODO(author): rescue SpO2 threshold - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        - { vital: "spO2", op: ">=", value: 0.95 }
        # TODO(author): rescue heart rate threshold - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        - { vital: "heartRate", op: "<=", value: 110 }
      # TODO(author): rescue hold duration - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
      holdSeconds: 30
      # Author's decision of 2026-11-20: rescue counts only after the left needle decompression (Requirements 2.21-2.23, 6.18)
      requiredInterventions: ["needle-decompression-left"]
    lost:
      groups:
        - conditions:
            # TODO(author): lost SpO2 threshold - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
            - { vital: "spO2", op: "<", value: 0.85 }
          # TODO(author): lost hold duration - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
          holdSeconds: 30
      # TODO(author): time limit - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
      timeLimitSeconds: 600
  hints:
    # TODO(author): hint 1 text (points to the exam) - draft from the bedside-exam spec, pending author review
    - text: 'Something is wrong with his breathing. Use the buttons under "Check on him" to examine him.'
    # TODO(author): hint 2 text (compare both sides) - draft from the bedside-exam spec, pending author review; cite a source for comparing breath sounds (candidate: ATLS 10th ed., verify)
    - text: "Listen to both sides of his chest. Is one side quieter than the other?"
    # TODO(author): hint 3 text, equal to the left variant - draft from the bedside-exam spec, pending author review (open question 5)
    - text: 'His left side is the quiet one. Press "Let the trapped air out - left side (needle)".'
  status:
    rules:
      - when: [{ vital: "spO2", band: "critical" }]
        # TODO(author): status sentence for critical SpO2 - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "His lips are turning blue and he is fighting for breath."
      - when: [{ vital: "spO2", band: "warning" }]
        # TODO(author): status sentence for warning SpO2 - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "He looks pale and is struggling to breathe."
      - when: [{ vital: "heartRate", band: "critical", direction: "high" }]
        # TODO(author): status sentence for critical high heart rate - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "His heart is racing and he looks frightened."
      - when: [{ vital: "heartRate", band: "warning", direction: "high" }]
        # TODO(author): status sentence for warning high heart rate - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "His heart is beating fast and he looks uneasy."
      - when: [{ vital: "respiratoryRate", band: "warning", direction: "high" }]
        # TODO(author): status sentence for warning high respiratory rate - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "He is breathing faster than normal."
      - when: [{ vital: "meanArterialPressure", band: "warning", direction: "low" }]
        # TODO(author): status sentence for warning low mean arterial pressure - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
        sentence: "He looks clammy and a little faint."
    # TODO(author): default status sentence - draft from engine runs on 2026-11-20 (commit 1e71454), pending author review
    defaultSentence: "He is breathing calmly and looks comfortable."
  # TODO(author): side reveal text, equal to the left variant - draft from the bedside-exam spec, pending author review (open question 6)
  sideRevealText: "The trapped air was in the left side of his chest."
  exam:
    actions:
      - id: look-chest
        # TODO(author): exam button label - draft from the bedside-exam spec, pending author review
        label: "Look at his chest"
        rules:
          # TODO(author): is the chest sign visible from the insult start or only later, and is it reduced movement, a bigger side or both? Cite a source (open question 4)
          - when: { insult: started, decompressed: false }
            # TODO(author): chest look finding - draft from the bedside-exam spec, verify and cite a source (candidate: ATLS 10th ed.) (open question 4)
            sentence: "One side of his chest hardly moves when he breathes."
            abnormal: true
        # TODO(author): normal chest look finding - draft from the bedside-exam spec, verify and cite a source
        defaultSentence: "Both sides of his chest rise and fall evenly."

      - id: listen
        labels:
          # TODO(author): exam button label, left - draft from the bedside-exam spec, pending author review
          Left: "Listen to his chest - left side"
          # TODO(author): exam button label, right - draft from the bedside-exam spec, pending author review
          Right: "Listen to his chest - right side"
        rules:
          # TODO(author): should reduced breath sounds show from the insult start or only after a Vital_Band changes? Cite a source (open question 12)
          - when: { side: affected, insult: started, decompressed: false }
            # TODO(author): breath sounds on the affected side - draft from the bedside-exam spec, verify and cite a source (candidate: ATLS 10th ed.)
            sentence: "You can barely hear any breathing on this side."
            abnormal: true
          # TODO(author): breath sounds on the affected side after the needle - wording, abnormal flag and any Vital_Band gate; cite a source (open question 1)
          - when: { side: affected, decompressed: true }
            # TODO(author): breath sounds after the needle - draft from the bedside-exam spec, verify and cite a source (open question 1)
            sentence: "Breathing sounds are coming back on this side."
        # TODO(author): normal breath sounds, also shown for a needled other side (open question 10) - draft from the bedside-exam spec, verify and cite a source
        defaultSentence: "You hear clear breathing on this side."

      - id: windpipe
        # TODO(author): exam button label - draft from the bedside-exam spec, pending author review
        label: "Feel the position of his windpipe"
        rules:
          - when:
              insult: started
              decompressed: false
              # TODO(author): PLACEHOLDER condition, not a clinical decision - choose the Vital_Bands that gate this late sign and cite a source (open question 2) - draft from the bedside-exam spec
              vitals: [{ vital: "spO2", band: "critical" }]
            # TODO(author): tracheal finding, kept side-neutral (decision 7, D11) - draft from the bedside-exam spec, verify and cite a source (open question 2)
            sentence: "His windpipe feels pushed off to one side."
            abnormal: true
        # TODO(author): normal tracheal position finding - draft from the bedside-exam spec, verify and cite a source
        defaultSentence: "His windpipe is in the middle of his neck."

      - id: neck-veins
        # TODO(author): exam button label - draft from the bedside-exam spec, pending author review
        label: "Look at his neck veins"
        rules:
          # TODO(author): early or late sign? Gate by a Vital_Band (for example a low blood pressure band)? Absent in some patients? Cite a source (open question 3)
          - when: { insult: started, decompressed: false }
            # TODO(author): neck vein finding - draft from the bedside-exam spec, verify and cite a source (candidate: ATLS 10th ed.) (open question 3)
            sentence: "The veins in his neck are bulging."
            abnormal: true
        # TODO(author): normal neck vein finding - draft from the bedside-exam spec, verify and cite a source
        defaultSentence: "His neck veins look normal."
  speech:
    status:
      - sentence: "His lips are turning blue and he is fighting for breath."
        lines:
          # TODO(author): speech line for critical SpO2 - draft from the patient-speech spec, pending author review
          - "Can't... breathe..."
          # TODO(author): speech line for critical SpO2 - draft from the patient-speech spec, pending author review
          - "Help... me..."
      - sentence: "He looks pale and is struggling to breathe."
        lines:
          # TODO(author): speech line for warning SpO2 - draft from the patient-speech spec, pending author review
          - "It's getting worse... I can't catch my breath."
          # TODO(author): speech line for warning SpO2 - draft from the patient-speech spec, pending author review
          - "Why can't I breathe properly?"
      - sentence: "His heart is racing and he looks frightened."
        lines:
          # TODO(author): speech line for critical high heart rate - draft from the patient-speech spec, pending author review
          - "My heart... it's pounding so hard..."
      - sentence: "His heart is beating fast and he looks uneasy."
        lines:
          # TODO(author): speech line for warning high heart rate - draft from the patient-speech spec, pending author review
          - "My heart's racing. What's happening to me?"
      - sentence: "He is breathing faster than normal."
        lines:
          # TODO(author): speech line for warning high respiratory rate - draft from the patient-speech spec, pending author review
          - "I can't... slow my breathing down."
      - sentence: "He looks clammy and a little faint."
        lines:
          # TODO(author): speech line for warning low mean arterial pressure - draft from the patient-speech spec, pending author review
          - "I feel dizzy... like I might pass out."
    early:
      # TODO(author): early speech line (requested, demo video shot 2) - draft from the patient-speech spec, pending author review
      - "I... can't... get a breath in. My chest-"
      # TODO(author): early speech line - draft from the patient-speech spec, pending author review
      - "It hurts... when I try to breathe in."
    rescued:
      # TODO(author): rescued speech line - draft from the patient-speech spec, pending author review
      - "Oh... I can breathe again. Thank you."
    # TODO(author): Forbidden_Speech_Terms list (still open question 9) - draft from the patient-speech spec, pending author review
    forbiddenTerms: ["needle", "decompress", "drain", "chest tube", "trapped air", "let the air out", "oxygen", "listen", "stethoscope", "windpipe", "trachea", "neck vein"]

# Author's game-rule decision recorded in the bedside-exam spec (Requirements 2.1-2.6): the side variants and their insultSide and requiredInterventions values
variants:
  - id: left
    overrides:
      insultSide: Left
      requiredInterventions: ["needle-decompression-left"]
      hints:
        # TODO(author): hint 1 text, left variant (points to the exam) - draft from the bedside-exam spec, pending author review
        - text: 'Something is wrong with his breathing. Use the buttons under "Check on him" to examine him.'
        # TODO(author): hint 2 text, left variant (compare both sides) - draft from the bedside-exam spec, pending author review; cite a source (candidate: ATLS 10th ed., verify)
        - text: "Listen to both sides of his chest. Is one side quieter than the other?"
        # TODO(author): hint 3 text, left variant - draft from the bedside-exam spec, pending author review (open question 5)
        - text: 'His left side is the quiet one. Press "Let the trapped air out - left side (needle)".'
      # TODO(author): side reveal text, left variant - draft from the bedside-exam spec, pending author review (open question 6)
      sideRevealText: "The trapped air was in the left side of his chest."
  - id: right
    overrides:
      insultSide: Right
      requiredInterventions: ["needle-decompression-right"]
      hints:
        # TODO(author): hint 1 text, right variant (points to the exam) - draft from the bedside-exam spec, pending author review
        - text: 'Something is wrong with his breathing. Use the buttons under "Check on him" to examine him.'
        # TODO(author): hint 2 text, right variant (compare both sides) - draft from the bedside-exam spec, pending author review; cite a source (candidate: ATLS 10th ed., verify)
        - text: "Listen to both sides of his chest. Is one side quieter than the other?"
        # TODO(author): hint 3 text, right variant - draft from the bedside-exam spec, pending author review (open question 5)
        - text: 'His right side is the quiet one. Press "Let the trapped air out - right side (needle)".'
      # TODO(author): side reveal text, right variant - draft from the bedside-exam spec, pending author review (open question 6)
      sideRevealText: "The trapped air was in the right side of his chest."

references:
  # TODO(author): Add specific ATLS or other trauma guideline references for tension pneumothorax recognition and management
  - citation: "American College of Surgeons. Advanced Trauma Life Support (ATLS) Student Course Manual. 10th ed."
    url: "https://www.facs.org/quality-programs/trauma/atls/"
